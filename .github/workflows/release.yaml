name: Release

on:
  push:
    tags:
      - "v0.*"

jobs:
  release:
    name: Release GHA
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs before the dist is built, so a stale default fails the release instead of
      # publishing one that every 'uses: releasetools/cli@v0' consumer ignores.
      - name: Verify action.yml matches the tag
        run: scripts/assert-action-version.sh "$GITHUB_REF_NAME"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Build the dist
        run: make all
        if: startsWith(github.ref, 'refs/tags/')

      # What somebody wrote for this version, not a list of commit subjects. Run before
      # the release step, so a tag whose version has no changelog section fails here
      # rather than publishing an empty description.
      - name: Read the changelog entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash dist/releasetools.bash changelog::section "${GITHUB_REF_NAME#v}" >RELEASE_NOTES.md

      - name: Release GHA
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/releasetools.bash
            dist/releasetools.bash.sha256
            dist/install.sh
            README.md

      # 'uses: releasetools/cli@v<major>' resolves through the major tag, so it moves
      # here, after the release it installs exists. The tag points at a commit on
      # release/<major> that carries the tagged tree without .github/: signed-push
      # commits it through createCommitOnBranch, which GitHub signs, so the major tag
      # lands on a verified commit without a GPG key on the runner. Its Source-Commit
      # trailer names the tagged commit.
      #
      # GITHUB_TOKEN cannot create a ref or a commit that brings in workflow files;
      # that takes the 'workflows' permission, which it is never granted. So neither
      # the tree nor the branch's history may contain .github/workflows. A consumer of
      # the action needs action.yml and scripts/, not the workflows.
      - name: Export the tagged tree
        id: major
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          tree="$RUNNER_TEMP/major-tree"
          mkdir -p "$tree"
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$tree"
          rm -rf "$tree/.github"

          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "major=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_OUTPUT"

      # signed-push commits onto an existing branch. A missing one starts as a root
      # commit holding a single placeholder file, made through the Git data API so it
      # references nothing from main. The signed commit that follows replaces the
      # placeholder with the exported tree.
      - name: Ensure the release branch exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ steps.major.outputs.major }}
        run: |
          set -euo pipefail

          branch="release/${MAJOR}"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
            echo "${branch} already exists"
            exit 0
          fi

          tree="$(jq -n --arg branch "$branch" '{tree: [{
            path: "RELEASE_BRANCH",
            mode: "100644",
            type: "blob",
            content: "\($branch) holds the published tree of each release; the next commit replaces this file.\n"
          }]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n --arg tree "$tree" --arg branch "$branch" \
            '{message: "Start \($branch)", tree: $tree, parents: []}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" -f sha="${commit}" >/dev/null
          echo "Created ${branch} at ${commit}"

      - name: Move the major tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: releasetools/actions/signed-push@76cf0826db3a16eed6baa02d03548628e7a32519 # v0.10.0
        with:
          source-dir: ${{ steps.major.outputs.tree }}
          target-repo: ${{ github.repository }}
          target-branch: release/${{ steps.major.outputs.major }}
          headline: "release: ${{ github.ref_name }}"
          body: |
            Source-Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}>
          prune: "true"
          tags: ${{ steps.major.outputs.major }}
          force-tags: "true"
          token: ${{ github.token }}

      # The tap bumps its formula from this release. It also polls daily, so this only
      # shortens the delay.
      # GITHUB_TOKEN is scoped to this repository, so it cannot dispatch to the
      # tap. The org's automation App can, and its installation token lasts an
      # hour rather than until somebody rotates a PAT. A missing App is a
      # notice rather than a failure: the tap polls daily, and a release is
      # not worth blocking over an org variable.
      - name: Generate a token for the tap
        id: app-token
        if: startsWith(github.ref, 'refs/tags/') && vars.GH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Notify the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no app token for releasetools/homebrew-tap; the tap will pick up $VERSION on its next scheduled run."
            exit 0
          fi

          gh api --method POST repos/releasetools/homebrew-tap/dispatches \
            -f event_type=upstream-released \
            -f "client_payload[version]=$VERSION"
