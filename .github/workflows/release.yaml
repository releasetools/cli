name: Release

on:
  push:
    tags:
      - "v0.*"

jobs:
  release:
    name: Release GHA
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs before the dist is built, so a stale default fails the release instead of
      # publishing one that every 'uses: releasetools/cli@v0' consumer ignores.
      - name: Verify action.yml matches the tag
        run: scripts/assert-action-version.sh "$GITHUB_REF_NAME"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Build the dist
        run: make all
        if: startsWith(github.ref, 'refs/tags/')

      # What somebody wrote for this version, not a list of commit subjects. Run before
      # the release step, so a tag whose version has no changelog section fails here
      # rather than publishing an empty description.
      - name: Read the changelog entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash dist/releasetools.bash changelog::section "${GITHUB_REF_NAME#v}" >RELEASE_NOTES.md

      - name: Release GHA
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/releasetools.bash
            dist/releasetools.bash.sha256
            dist/install.sh
            README.md

      # The tap bumps its formula from this release. It also polls daily, so this only
      # shortens the delay.
      # GITHUB_TOKEN is scoped to this repository, so it cannot dispatch to the
      # tap. The org's automation App can, and its installation token lasts an
      # hour rather than until somebody rotates a PAT. A missing App is a
      # notice rather than a failure: the tap polls daily, and a release is
      # not worth blocking over an org variable.
      - name: Generate a token for the tap
        id: app-token
        if: startsWith(github.ref, 'refs/tags/') && vars.GH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Notify the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no app token for releasetools/homebrew-tap; the tap will pick up $VERSION on its next scheduled run."
            exit 0
          fi

          gh api --method POST repos/releasetools/homebrew-tap/dispatches \
            -f event_type=upstream-released \
            -f "client_payload[version]=$VERSION"
