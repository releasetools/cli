name: Test GHA Release

on:
  push:
    tags:
      - "v0.*"

# The installer downloads a public release asset over unauthenticated HTTPS, so every job
# that only installs the CLI needs no token at all. 'wait-for-release' grants itself the
# two scopes it does use.
permissions: {}

jobs:
  wait-for-release:
    name: Wait for Release to complete
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Built from the tag under test rather than installed through
      # 'uses: releasetools/cli@v0'. That action downloads the release this job is waiting
      # for, which by definition does not exist yet.
      - name: Build the dist
        run: make all

      - name: Wait for release
        env:
          # GH_REPO and SHA carry values the runner already publishes, as GITHUB_REPOSITORY
          # and GITHUB_SHA. The rename matters for the first: gh looks for GH_REPO and never
          # at GITHUB_REPOSITORY. GITHUB_TOKEN is not a default variable at all.
          GH_TOKEN: ${{ github.token }} # no runner default
          GH_REPO: ${{ github.repository }} # = $GITHUB_REPOSITORY; gh reads GH_REPO
          SHA: ${{ github.sha }} # = $GITHUB_SHA
        run: bash dist/releasetools.bash github::await_workflow "$SHA" release.yaml

  test-default:
    name: Test simple install
    runs-on: ubuntu-latest
    needs: wait-for-release
    steps:
      - uses: releasetools/cli@v0
      - name: Run tests
        shell: bash
        run: |
          releasetools version
          releasetools base::check_deps

  test-explicit-version:
    name: Test install current tag
    runs-on: ubuntu-latest
    needs: wait-for-release
    steps:
      - name: Extract release version
        shell: bash
        run: |
          GITHUB_REF='${{ github.ref }}'
          if [[ "$GITHUB_REF" =~ refs/tags/(v[0-9]+\..*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Found release version: $VERSION" >&2
            echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          else
            echo "No matching version found" >&2
            exit 1
          fi
      - uses: releasetools/cli@v0
        with:
          version: ${{ env.VERSION }}
      - name: Run Tests
        shell: bash
        run: |
          releasetools version
          releasetools base::check_deps

  test-customizations:
    name: Test customizations
    runs-on: ubuntu-latest
    needs: wait-for-release
    steps:
      - uses: releasetools/cli@v0
        env:
          RELEASETOOLS_INSTALL_DIR: /opt/hostedtoolcache/releasetools
          RELEASETOOLS_BINARY_DIR: ${{ runner.temp }}/bin

      - name: Ensure the release tools are installed and working
        shell: bash
        run: |
          ${{ runner.temp }}/bin/releasetools version
          ${{ runner.temp }}/bin/releasetools base::check_deps

  test-manual-install:
    name: Test manual install
    runs-on: ubuntu-latest
    needs: wait-for-release
    steps:
      - name: Extract release version
        shell: bash
        run: |
          GITHUB_REF='${{ github.ref }}'
          if [[ "$GITHUB_REF" =~ refs/tags/(v[0-9]+\..*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Found release version: $VERSION" >&2
            echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          else
            echo "No matching version found" >&2
            exit 1
          fi
      - name: Install releasetools from source
        shell: bash
        env:
          RELEASETOOLS_INSTALL_DIR: /opt/hostedtoolcache/releasetools
          RELEASETOOLS_BINARY_DIR: ${{ runner.temp }}/bin
        run: |
          bash <(curl -sSL "https://github.com/releasetools/cli/releases/download/${{ env.VERSION }}/install.sh")

      - name: Ensure the release tools are installed and working
        shell: bash
        run: |
          ${{ runner.temp }}/bin/releasetools version
          ${{ runner.temp }}/bin/releasetools base::check_deps

  test-platforms:
    name: Test on multiple platforms
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          # macos-13 was retired by GitHub; the label no longer resolves to a runner.
          # macos-26 replaces it, matching the images the homebrew tap tests against.
          - macos-14
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    needs: wait-for-release
    steps:
      - name: Extract release version
        shell: bash
        run: |
          GITHUB_REF='${{ github.ref }}'
          if [[ "$GITHUB_REF" =~ refs/tags/(v[0-9]+\..*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Found release version: $VERSION" >&2
            echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          else
            echo "No matching version found" >&2
            exit 1
          fi
      - uses: releasetools/cli@v0
        with:
          version: ${{ env.VERSION }}
      - name: Run tests
        shell: bash
        run: |
          releasetools version
          releasetools base::check_deps
