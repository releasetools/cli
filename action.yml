name: "Release Tools for bash"
description: "Installs release tools in a GitHub workflow"
author: "Mihai Bojin <mihai.bojin@gmail.com>"
inputs:
  version:
    # Not "the latest release": this is the version pinned at the ref this action was
    # resolved from, so 'releasetools/cli@v0' installs whatever v0 currently points at.
    # scripts/assert-action-version.sh keeps it equal to the tag being released.
    description: "The version to install, defaults to the release this action ships with"
    required: false
    default: "v0.0.12"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        if ! command -v pip >/dev/null 2>&1; then
          echo "WARN: pip is not installed or not found in PATH." >&2
        else
          echo "Installing required dependencies..." >&2
          pip install --user -r ${{ github.action_path }}/requirements.txt
        fi

    - name: Install the release tools
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        ${{ github.action_path }}/scripts/action-install.sh
